<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 팀 설정</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="app.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="meetings.html" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">M</div>
      <span class="font-extrabold tracking-tight">MeetingNote</span>
    </a>
    <nav class="flex items-center gap-1 text-[13px] font-bold ml-2 min-w-0 overflow-x-auto whitespace-nowrap">
      <a href="meetings.html" data-ui="navLink">회의록</a>
      <a href="todos.html" data-ui="navLink">할 일</a>
      <span class="px-2.5 py-1 rounded-lg bg-page dark:bg-chip">팀</span>
      <a href="profile.html" data-ui="navLink">내 정보</a>
    </nav>
    <div class="ml-auto flex items-center gap-2" id="themeSlot"></div>
  </div>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5 space-y-4">

  <!-- 팀 만들기 / 합류 (소속 팀이 없을 때) -->
  <section id="onboard" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge
           border-l-[6px] border-l-purple-dot p-5">
    <h1 class="text-lg font-extrabold">아직 소속 팀이 없음</h1>
    <p class="text-[13px] text-ink-2 dark:text-dim mt-1">팀을 새로 만들거나, 받은 초대코드로 합류</p>
    <div class="mt-4 grid gap-3 sm:grid-cols-2">
      <div class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge p-4">
        <p class="text-[13px] font-extrabold mb-2">팀 만들기</p>
        <input id="newName" data-ui="input" placeholder="팀 이름" aria-label="팀 이름" maxlength="100">
        <button id="createBtn" type="button" data-ui="btnPrimary" class="mt-2.5 w-full">만들기</button>
        <div id="createErr" class="hidden mt-2.5"></div>
      </div>
      <div class="rounded-xl bg-page dark:bg-chip border border-line dark:border-edge p-4">
        <p class="text-[13px] font-extrabold mb-2">초대코드로 합류</p>
        <input id="joinCode" data-ui="input" class="font-mono tracking-widest" placeholder="MN-7K2D" aria-label="초대코드">
        <button id="joinBtn" type="button" data-ui="btnGhost" class="mt-2.5 w-full">합류</button>
      </div>
    </div>
    <div id="joinErr" class="hidden mt-3"></div>
  </section>

  <!-- 팀 정보 -->
  <section id="info" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex flex-wrap items-start gap-4">
      <div class="flex-1 min-w-[200px]">
        <label for="tName" class="block text-[11px] font-bold text-ink-3 dark:text-dim mb-1">팀 이름</label>
        <input id="tName" data-ui="input" class="font-bold" maxlength="100">
        <button id="saveName" type="button" data-ui="btnPrimary" class="mt-2">이름 저장</button>
      </div>
      <div>
        <p class="text-[11px] font-bold text-ink-3 dark:text-dim mb-1">초대코드</p>
        <div class="flex gap-2">
          <div class="h-11 px-4 grid place-items-center rounded-xl bg-page dark:bg-chip border border-line dark:border-edge
                      font-mono text-sm font-extrabold tracking-[0.2em]" id="code"></div>
          <button id="copyBtn" type="button" data-ui="btnGhost">복사</button>
          <button id="newCodeBtn" type="button" data-ui="btnGhost">재발급</button>
        </div>
      </div>
    </div>
    <p id="roleNote" class="hidden mt-3 text-[11px] text-ink-3 dark:text-dim">member 로 들어오면 읽기만 가능. 팀 이름과 초대코드는 owner 만 바꿈</p>
    <div id="codeMsg" class="hidden mt-3"></div>
  </section>

  <!-- 멤버 -->
  <section id="memberBox" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">멤버 <span id="mCap" class="text-ink-3 dark:text-dim font-bold"></span></h2>
      <span class="ml-auto text-[11px] text-ink-3 dark:text-dim">팀당 6명 이내</span>
    </div>
    <ul id="members" class="grid gap-2 sm:grid-cols-2"></ul>
  </section>

  <!-- 활동 기록 -->
  <section id="actBox" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">활동 기록</h2>
      <span class="text-[11px] text-ink-3 dark:text-dim">최근 순</span>
    </div>
    <ol id="acts" class="space-y-2.5"></ol>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const KIND_COLOR = { meeting_add: "blue", todo_assign: "orange", todo_done: "green", comment_add: "purple", member_join: "purple" };
  let TEAM = null;

  const show = (box, kind, title, body) => {
    $(box).innerHTML = window.notice(kind, title, body);
    $(box).classList.remove("hidden");
  };

  function lock(on) {
    // member 로 들어오면 owner 전용 컨트롤을 흐리게 하고 누를 수 없게 한다
    $("tName").readOnly = on;
    $("tName").classList.toggle("opacity-60", on);
    [$("saveName"), $("copyBtn"), $("newCodeBtn")].forEach((b) => {
      b.disabled = on;
      window.UI.disabled.split(" ").forEach((c) => b.classList.toggle(c, on));
    });
    $("roleNote").classList.toggle("hidden", !on);
  }

  function renderInfo() {
    $("tName").value = TEAM.name;
    $("code").textContent = TEAM.invite_code;
    lock(TEAM.role !== "owner");
  }

  async function renderLists() {
    const members = await App.api("GET", "/teams/" + TEAM.id + "/members");
    $("mCap").textContent = members.length + " / 6";
    $("members").innerHTML = members.map((m) => `
      <li class="${window.UI.card} bg-page dark:bg-chip p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-white dark:bg-surface border border-line dark:border-edge grid place-items-center text-[13px] font-extrabold">${App.esc(m.name[0])}</div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-bold">${App.esc(m.name)}</p>
          <p class="text-[11px] text-ink-3 dark:text-dim truncate">${App.esc(m.email)}</p>
        </div>
        <div class="text-right shrink-0">
          <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${m.role === "owner" ? window.LABEL.purple : "text-ink-2 dark:text-dim"} bg-white dark:bg-surface">${m.role}</span>
          <p class="mt-1 text-[10px] text-ink-3 dark:text-dim">할 일 ${m.todo_count}</p>
        </div>
      </li>`).join("");
    const acts = await App.api("GET", "/teams/" + TEAM.id + "/activities");
    $("acts").innerHTML = acts.length ? acts.map((a) => `
      <li class="${window.UI.card} bg-page dark:bg-chip ${window.STRIPE[KIND_COLOR[a.kind]]} px-3.5 py-2.5">
        <p class="text-[13px]"><span class="font-bold">${App.esc(a.actor_name)}</span>  ·  ${App.esc(a.text)}</p>
        <p class="text-[11px] text-ink-3 dark:text-dim mt-0.5">${App.ago(a.created_at)}</p>
      </li>`).join("") : `<li class="text-[12px] text-ink-3 dark:text-dim">아직 활동이 없음</li>`;
  }

  async function load() {
    const teams = await App.api("GET", "/teams");
    TEAM = teams[0] || null;
    const has = !!TEAM;
    $("onboard").classList.toggle("hidden", has);
    ["info", "memberBox", "actBox"].forEach((i) => $(i).classList.toggle("hidden", !has));
    App.saveSession(null, has ? TEAM.id : null, has ? TEAM.role : null);
    if (has) { renderInfo(); await renderLists(); }
  }

  // 팀 만들기 · 합류
  $("createBtn").onclick = async () => {
    $("createErr").classList.add("hidden");
    const name = $("newName").value.trim();
    if (!name) return show("createErr", "red", "팀 이름을 입력해야 함");
    try { await App.api("POST", "/teams", { name }); await load(); }
    catch (ex) { show("createErr", "red", "팀을 만들지 못함", ex.msg); }
  };
  $("joinBtn").onclick = async () => {
    $("joinErr").classList.add("hidden");
    const code = $("joinCode").value.trim();
    if (!code) return show("joinErr", "red", "초대코드를 입력해야 함");
    try { await App.api("POST", "/teams/join", { invite_code: code }); await load(); }
    catch (ex) { joinFail(ex.code); }   // 코드가 틀려도 가입 계정은 그대로 유지
  };
  function joinFail(code) {
    if (code === "TEAM_FULL") show("joinErr", "red", "팀 정원이 찼음", "팀당 6명 이내");
    else show("joinErr", "red", "없는 초대코드", "코드를 다시 확인");
  }

  // 팀 이름 · 초대코드 (owner)
  $("saveName").onclick = async () => {
    const name = $("tName").value.trim();
    if (!name) return show("codeMsg", "red", "팀 이름을 입력해야 함");
    try {
      const t = await App.api("PUT", "/teams/" + TEAM.id, { name });
      TEAM.name = t.name;
      show("codeMsg", "green", "팀 이름을 저장함");
    } catch (ex) { show("codeMsg", "red", "저장하지 못함", ex.msg); }
  };
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(TEAM.invite_code); } catch (_) {}
    show("codeMsg", "green", "초대코드를 복사함", "받는 사람은 회원가입 화면의 초대코드 칸에 붙여넣음");
  };
  $("newCodeBtn").onclick = async () => {
    try {
      const before = TEAM.invite_code;
      const r = await App.api("PUT", "/teams/" + TEAM.id + "/code");
      TEAM.invite_code = r.invite_code;
      $("code").textContent = r.invite_code;
      show("codeMsg", "orange", "초대코드를 다시 발급함", `앞의 코드 ${before} 는 더 쓸 수 없음. 이미 합류한 멤버는 그대로`);
    } catch (ex) { show("codeMsg", "red", "발급하지 못함", ex.msg); }
  };

  window.onThemeChange = () => {};
  window.addEventListener("DOMContentLoaded", async () => {
    if (!App.requireLogin()) return;
    await load();
    // 가입 직후 초대코드 합류에 실패해 넘어온 경우
    const q = new URLSearchParams(location.search);
    if (q.get("invite_error") && !TEAM) {
      $("joinCode").value = q.get("invite_error");
      joinFail(q.get("code"));
    }
  });
</script>
</body>
</html>
