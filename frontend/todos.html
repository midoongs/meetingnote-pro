<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 할 일 칸반</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="app.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="meetings.html" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">M</div>
      <span class="font-extrabold tracking-tight">MeetingNote</span>
    </a>
    <nav class="flex items-center gap-1 text-[13px] font-bold ml-2 min-w-0 overflow-x-auto whitespace-nowrap">
      <a href="meetings.html" data-ui="navLink">회의록</a>
      <span class="px-2.5 py-1 rounded-lg bg-page dark:bg-chip">할 일</span>
      <a href="team.html" data-ui="navLink">팀</a>
      <a href="profile.html" data-ui="navLink">내 정보</a>
    </nav>
    <div class="ml-auto" id="themeSlot"></div>
  </div>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5">

  <!-- 탭 + 필터 -->
  <section data-ui="panel" class="p-4 mb-4">
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex gap-1 p-1 rounded-xl bg-page dark:bg-chip">
        <button id="tabMine" type="button" class="px-3 py-1.5 rounded-lg text-[13px] font-bold transition">내 할 일</button>
        <button id="tabAll" type="button" class="px-3 py-1.5 rounded-lg text-[13px] font-bold transition">전체</button>
      </div>
      <select id="fWho" aria-label="담당자 필터" class="h-10 px-3 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-[13px] font-bold focus:outline-none focus:border-blue-dot transition"></select>
      <span id="sum" class="ml-auto text-[12px] text-ink-3 dark:text-dim"></span>
    </div>
  </section>

  <!-- 칸반 3열 -->
  <div id="board" class="grid gap-3 md:grid-cols-3"></div>

  <div id="empty" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge px-5 py-12 text-center">
    <p class="text-sm font-bold" id="emptyTitle">배정된 할 일이 없음</p>
    <p class="text-[12px] text-ink-2 dark:text-dim mt-1" id="emptySub">회의록을 올리면 할 일이 자동으로 뽑혀 나옴</p>
  </div>

  <div id="toast" class="hidden mt-4"></div>
  <p class="mt-3 text-[11px] text-ink-3 dark:text-dim">카드를 끌어 옮기거나, 눌러서 옮길 칸을 고릅니다. 좁은 화면에서는 누르는 길을 씁니다.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const COLS = [
    { key: "OPEN",  label: "대기", color: "orange" },
    { key: "DOING", label: "진행", color: "blue" },
    { key: "DONE",  label: "완료", color: "green" },
  ];
  let ALL = [], mine = true, dragId = null, overCol = null, editingDue = null;
  const teamId = App.teamId();

  const visible = () => {
    const f = $("fWho").value;             // 담당자 필터는 화면에서 거름. 서버를 다시 부르지 않음
    if (!f) return ALL;
    return ALL.filter((t) => (f === "__none__" ? t.assignee_id == null : String(t.assignee_id) === f));
  };

  const chip = (t) => {
    const late = App.isLate(t);
    return `
    <article data-id="${t.id}"
      class="card touch-none select-none cursor-grab active:cursor-grabbing ${window.UI.card} ${late ? window.STRIPE.red : ""}
             p-3 hover:border-ink dark:hover:border-dim transition ${dragId === t.id ? "opacity-40" : ""}">
      <p class="text-[13px] font-bold leading-snug">${App.esc(t.what)}</p>
      <p class="mt-1 text-[11px] text-ink-3 dark:text-dim">${App.esc(t.meeting_title)}</p>
      <div class="mt-2 flex items-center gap-1.5">
        <button type="button" data-act="assign" data-id="${t.id}" class="${window.UI.chipBtn}">${App.esc(t.assignee_name || "미정")}</button>
        ${editingDue === t.id
          ? `<input data-act="dueInput" data-id="${t.id}" value="${App.esc(t.due_text)}" maxlength="100" aria-label="기한" class="${window.UI.miniInput} w-24">`
          : `<button type="button" data-act="due" data-id="${t.id}" class="${window.UI.chipBtn} ${late ? "text-red-text dark:text-red-dot" : ""}">${App.esc(t.due_text)}</button>`}
        <button type="button" data-act="del" data-id="${t.id}" ${t.can_delete ? "" : "disabled"}
          class="${window.UI.chipBtn} ml-auto text-red-text dark:text-red-dot ${t.can_delete ? "" : window.UI.disabled}">삭제</button>
      </div>
    </article>`;
  };

  function renderFilter() {
    const keep = $("fWho").value;
    const seen = new Map();
    ALL.forEach((t) => (t.assignable || []).forEach((m) => seen.set(String(m.id), m.name)));
    $("fWho").innerHTML = `<option value="">담당자 전체</option>` +
      [...seen].map(([id, name]) => `<option value="${id}">${App.esc(name)}</option>`).join("") +
      `<option value="__none__">미정</option>`;
    $("fWho").value = [...$("fWho").options].some((o) => o.value === keep) ? keep : "";
  }

  function render() {
    const rows = visible();
    $("board").innerHTML = COLS.map((c) => {
      const items = rows.filter((t) => t.status === c.key);
      return `
      <section data-col="${c.key}"
        class="dropzone rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge
               ${window.STRIPE[c.color]} p-4 min-h-[220px] transition">
        <div class="flex items-baseline gap-2 mb-3">
          <h2 class="text-sm font-extrabold ${window.LABEL[c.color]}">${c.label}</h2>
          <span class="text-[11px] text-ink-3 dark:text-dim">${items.length}건</span>
          <span data-hint class="hidden ml-auto text-[10px] font-extrabold ${window.LABEL[c.color]}">여기에 놓기</span>
        </div>
        <div class="space-y-2.5">${items.map(chip).join("") ||
          `<p class="text-[12px] text-ink-3 dark:text-dim py-2">없음</p>`}</div>
      </section>`;
    }).join("");
    $("board").classList.toggle("hidden", ALL.length === 0);
    $("empty").classList.toggle("hidden", ALL.length > 0);
    $("emptyTitle").textContent = mine ? "배정된 할 일이 없음" : "할 일이 없음";
    const done = rows.filter((t) => t.status === "DONE").length;
    $("sum").textContent = rows.length ? `${done} / ${rows.length} 완료` : "";
    const on = "bg-white dark:bg-surface shadow-sm", off = "text-ink-2 dark:text-dim";
    $("tabMine").className = "px-3 py-1.5 rounded-lg text-[13px] font-bold transition " + (mine ? on : off);
    $("tabAll").className = "px-3 py-1.5 rounded-lg text-[13px] font-bold transition " + (!mine ? on : off);
    bindDrag();
    bindBadge();
    const inp = document.querySelector('[data-act="dueInput"]');
    if (inp) inp.focus();
  }

  const toast = (kind, title, body) => {
    $("toast").innerHTML = window.notice(kind, title, body);
    $("toast").classList.remove("hidden");
  };

  async function load() {
    $("toast").classList.add("hidden");
    ALL = await App.api("GET", mine ? "/me/todos" : "/teams/" + teamId + "/todos");
    renderFilter();
    render();
  }

  // 한 건을 고친다. 실패하면 되돌린다
  async function patch(t, body, okTitle) {
    const before = { ...t };
    Object.assign(t, body.status ? { status: body.status } : {});
    render();
    try {
      const row = await App.api("PUT", "/todos/" + t.id, body);
      Object.assign(t, row);
      if (okTitle) toast("green", okTitle);
    } catch (ex) {
      Object.assign(t, before);                 // 카드가 원래 자리로 돌아감
      toast("red", "고치지 못함", ex.msg);
    }
    render();
  }

  // 담당자 · 기한 배지 - 담당자는 눌러서 팀원을 차례로 고르고, 기한은 눌러서 글자로 씀
  function bindBadge() {
    document.querySelectorAll("[data-act]").forEach((el) => {
      el.addEventListener("mousedown", (e) => e.stopPropagation());
      const t = ALL.find((x) => x.id === +el.dataset.id);
      if (!t) return;
      if (el.dataset.act === "dueInput") {
        const save = () => {
          editingDue = null;
          const v = el.value.trim() || "미정";
          if (v !== t.due_text) patch(t, { due_text: v }, "기한을 고침"); else render();
        };
        el.addEventListener("blur", save, { once: true });
        el.addEventListener("keydown", (e) => { if (e.key === "Enter") el.blur(); if (e.key === "Escape") { el.value = t.due_text; el.blur(); } });
        return;
      }
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        if (el.disabled) return;
        if (el.dataset.act === "assign") {
          const opts = [{ id: null, name: "미정" }, ...(t.assignable || [])];
          const i = opts.findIndex((o) => o.id === t.assignee_id);
          const next = opts[(i + 1) % opts.length];
          patch(t, { assignee_id: next.id }, "담당자를 바꿈");
        } else if (el.dataset.act === "due") {
          editingDue = t.id; render();
        } else if (el.dataset.act === "del") {
          App.api("DELETE", "/todos/" + t.id).then(() => {
            ALL = ALL.filter((x) => x.id !== t.id);
            toast("red", "할 일을 지움");
            render();
          }).catch((ex) => toast("red", "지우지 못함", ex.msg));
        }
      });
    });
  }

  // 끌어 옮기기 - 포인터 이벤트 한 벌로 마우스 · 터치 · 펜을 모두 받는다
  //   HTML5 네이티브 드래그(draggable)는 터치에서 이벤트가 뜨지 않으므로 쓰지 않는다
  //   끄는 동안에는 보드를 다시 그리지 않고 클래스만 바꾼다. 다시 그리면 집은 카드가 사라져 포인터를 잃는다
  let ghost = null, startX = 0, startY = 0, moved = false;

  function colUnder(x, y) {
    const el = document.elementFromPoint(x, y);
    const z = el && el.closest(".dropzone");
    return z ? z.dataset.col : null;
  }

  const HOT = ["border-dashed", "border-2"];
  function markOver(col) {
    document.querySelectorAll(".dropzone").forEach((z) => {
      const c = COLS.find((x) => x.key === z.dataset.col);
      const on = z.dataset.col === col;
      HOT.forEach((k) => z.classList.toggle(k, on));
      z.classList.toggle("border-" + c.color + "-dot", on);
      z.classList.toggle("border-line", !on);
      z.classList.toggle("dark:border-edge", !on);
      const hint = z.querySelector("[data-hint]");
      if (hint) hint.classList.toggle("hidden", !on);
    });
  }

  function bindDrag() {
    document.querySelectorAll(".card").forEach((el) => {
      el.addEventListener("pointerdown", (e) => {
        if (e.target.closest("[data-act]")) return;     // 배지는 누르는 것이지 끄는 것이 아님
        if (e.button !== undefined && e.button !== 0) return;
        dragId = +el.dataset.id;
        startX = e.clientX; startY = e.clientY; moved = false;
      });
    });
  }

  document.addEventListener("pointermove", (e) => {
    if (dragId === null) return;
    const el = document.querySelector('.card[data-id="' + dragId + '"]');
    if (!el) return;
    if (!moved) {
      if (Math.abs(e.clientX - startX) < 6 && Math.abs(e.clientY - startY) < 6) return;
      moved = true;
      closePicker();
      const r = el.getBoundingClientRect();
      ghost = el.cloneNode(true);
      ghost.classList.add("fixed", "pointer-events-none", "z-50", "opacity-80", "shadow-lg");
      ghost.style.width = r.width + "px";
      document.body.appendChild(ghost);
      el.classList.add("opacity-40");
    }
    e.preventDefault();
    ghost.style.left = (e.clientX - 40) + "px";
    ghost.style.top = (e.clientY - 18) + "px";
    const c = colUnder(e.clientX, e.clientY);
    if (c !== overCol) { overCol = c; markOver(c); }
  });

  function finish(e) {
    if (dragId === null) return;
    if (ghost) { ghost.remove(); ghost = null; }
    const id = dragId;
    const col = moved ? colUnder(e.clientX, e.clientY) : null;
    const wasTap = !moved;
    const t = ALL.find((x) => x.id === id);
    dragId = null; overCol = null; moved = false;
    if (t && col && t.status !== col) { moveTo(t, col); } else { render(); }
    // 끌지 않고 눌렀으면 옮길 칸을 고르는 메뉴를 연다 (휴대폰에서 유일한 길)
    if (wasTap && t) openPicker(id);
  }
  document.addEventListener("pointerup", finish);
  document.addEventListener("pointercancel", finish);

  function moveTo(t, col) { patch(t, { status: col }, "상태를 옮김"); }   // 놓는 순간 한 번만 호출

  function openPicker(id) {
    closePicker();
    const card = document.querySelector('.card[data-id="' + id + '"]');
    const t = ALL.find((x) => x.id === id);
    if (!card || !t) return;
    const box = document.createElement("div");
    box.id = "picker";
    box.className = "mt-2 flex gap-1.5 border-t border-line dark:border-edge pt-2";
    COLS.forEach((c) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.label;
      b.className = "flex-1 py-1.5 rounded-lg text-[11px] font-bold transition " +
        (t.status === c.key
          ? "bg-page dark:bg-chip text-ink-3 dark:text-dim"
          : "bg-white dark:bg-surface border border-line dark:border-edge hover:border-ink dark:hover:border-dim " + window.LABEL[c.color]);
      if (t.status !== c.key) b.addEventListener("click", (ev) => { ev.stopPropagation(); moveTo(t, c.key); });
      b.addEventListener("pointerdown", (ev) => ev.stopPropagation());
      box.appendChild(b);
    });
    card.appendChild(box);
  }
  function closePicker() { const p = document.getElementById("picker"); if (p) p.remove(); }
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".card")) closePicker(); });

  $("tabMine").onclick = () => { mine = true; load(); };
  $("tabAll").onclick = () => { mine = false; load(); };
  $("fWho").onchange = render;
  window.onThemeChange = render;

  window.addEventListener("DOMContentLoaded", () => {
    if (!App.requireLogin()) return;
    if (!teamId) { location.href = "/team.html"; return; }
    load();
  });
</script>
</body>
</html>
